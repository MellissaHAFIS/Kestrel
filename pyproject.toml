[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyguard"
version = "0.1.0"
description = "Security layer that supervises AI agents' tool use (MCP tool poisoning, chain-level exfiltration)."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: resolved at skeleton creation time with Python 3.12.6.
dependencies = [
    "langgraph==1.2.14",
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-mcp-adapters==0.3.2",  # standalone MCP loader, see demo/devassist.py
    "mcp==1.30.0",                    # official Python SDK (includes mcp.server.fastmcp.FastMCP)
    "PyYAML==6.0.3",
    "detect-secrets==1.5.0",
    "chainlit==2.12.0",
]

[project.optional-dependencies]
# Heavy ML deps (gate classifier). Not needed for the skeleton.
ml = [
    "scikit-learn==1.9.1",
    "transformers==5.19.0",
    "torch==2.14.1",
]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
